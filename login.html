<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StockSense Pro | Login</title>
  <link rel="stylesheet" href="styles.css"/>
</head>

<body class="login-page">

  <div class="login-container">
    <div class="login-box">
      <h1>StockSense Pro</h1>
      <h2>Sign in to continue</h2>

      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input id="email" type="email" required placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input id="password" type="password" required placeholder="Enter your password">
        </div>

        <button type="submit" class="login-button">Sign In</button>
      </form>

      <p>New here? <a href="signup.html">Create an account</a></p>
    </div>
  </div>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const res = await fetch("http://127.0.0.1:8000/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();
  alert(data.message);

  if (data.success) {
    localStorage.setItem("isLoggedIn", "true");
    localStorage.setItem("userEmail", email);

    // ✅ After login → open ANALYSIS PAGE
    window.location.href = "index.html";
  }
});
</script>

</body>
</html>
